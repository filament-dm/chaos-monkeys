<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Change at 3:07</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #0d1220; color: #e6e1d3; font: 16px/1.5 Georgia, serif; display: grid; place-items: center; overflow: hidden; user-select: none; }
  .stage { width: min(860px, 96vw); height: min(560px, 94vh); display: grid; grid-template-rows: auto 1fr auto; padding: 24px; box-sizing: border-box; gap: 12px; }
  h2 { margin: 0; font-size: 24px; font-weight: normal; }
  .lede { margin: 2px 0 0; color: #a9b0c4; font-style: italic; }
  .window { position: relative; border-radius: 18px; overflow: hidden; background: linear-gradient(#1b2440, #0a0e19); border: 8px solid #3a2f25; }
  .lights { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 140px, rgba(242,196,109,.55) 140px 146px, transparent 146px 300px);
    animation: pass 1.1s linear infinite; opacity: .5; }
  @keyframes pass { to { background-position: -300px 0; } }
  .clock { position: absolute; right: 18px; top: 14px; font: bold 34px ui-monospace, Menlo, monospace; color: #f2c46d; letter-spacing: .04em; }
  .board { position: absolute; left: 18px; bottom: 16px; right: 18px; font: 13px ui-monospace, Menlo, monospace; color: #9fd3c7; }
  .say p { margin: 0 0 8px; } .say .s { color: #9fd3c7; } .say .end { color: #f2c46d; font-style: italic; }
  .row { display: flex; gap: 12px; align-items: center; }
  button { font: 15px system-ui, sans-serif; padding: 8px 14px; border-radius: 6px; border: 1px solid #b33b2e; background: #5a1d17; color: #f6e7d6; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  .tries { font: 12px ui-monospace, Menlo, monospace; color: #7d86a0; }
</style>
</head>
<body>
<div class="stage">
  <div>
    <h2>Change at 3:07</h2>
    <p class="lede">The night train doesn't run on time. It runs on times. The ticket says change at 3:07 a.m., and nobody is going to call the stop.</p>
  </div>
  <div class="window">
    <div class="lights" id="lights"></div>
    <div class="clock" id="clock">1:30</div>
    <div class="board" id="board">NEXT: ?</div>
  </div>
  <div>
    <div class="say" id="say"><p>Pull the cord when the carriage clock reads <b>3:07</b>. Any other minute, the doors open somewhere else.</p></div>
    <div class="row"><button id="cord">Pull the cord</button><span class="tries" id="tries"></span></div>
  </div>
</div>
<script>
// The carriage clock runs from 1:30 to 4:30 and wraps. Stopping within a minute of 3:07 wins.
const stops = [
  [95, "1:35 · a platform in 1958. A keeper you've never met is teaching a monkey to count to twelve. You get back on."],
  [130, "2:10 · a platform in 1974. The Monkey House sign is being repainted. The painter leaves room for a thirteenth number, then paints over it. You get back on."],
  [165, "2:45 · a platform in 1989. Rain, and a boy with his face pressed to cage 4. He waves at you. You get back on."],
  [205, "3:25 · a platform in 2003. Someone is reading the night log out loud to nobody. You get back on."],
  [245, "4:05 · a platform in a year with no number. Very quiet. You get back on, quickly."]
];
const clock = document.getElementById("clock"), board = document.getElementById("board"), say = document.getElementById("say"),
      cord = document.getElementById("cord"), triesEl = document.getElementById("tries"), lights = document.getElementById("lights");
let m = 90, tries = 0, running = true; // m = minutes after midnight
function fmt(t) { return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }
function line(text, cls) {
  const p = document.createElement("p"); if (cls) p.className = cls; p.textContent = text; say.append(p);
  while (say.children.length > 3) say.firstChild.remove();
}
const timer = setInterval(() => {
  if (!running) return;
  m = m >= 270 ? 90 : m + 1;
  clock.textContent = fmt(m);
  const next = stops.find(s => s[0] >= m) || stops[0];
  board.textContent = "NEXT: " + next[1].split(" · ")[0] + " · " + next[1].split(" · ")[1].split(".")[0];
}, 140);
cord.addEventListener("click", () => {
  if (!running) return;
  tries++; triesEl.textContent = tries + (tries === 1 ? " stop" : " stops");
  if (Math.abs(m - 187) <= 1) return arrive();
  running = false; lights.style.animationPlayState = "paused"; cord.disabled = true;
  let best = stops[0];
  for (const s of stops) if (Math.abs(s[0] - m) < Math.abs(best[0] - m)) best = s;
  line(best[1], "s");
  setTimeout(() => { running = true; lights.style.animationPlayState = "running"; cord.disabled = false; }, 2600);
});
function arrive() {
  running = false; clearInterval(timer); cord.disabled = true; lights.style.animationPlayState = "paused";
  clock.textContent = "3:07"; board.textContent = "THIS STOP: THE MONKEY HOUSE";
  line("3:07. The doors open onto the Monkey House, at night, with every cage locked and twelve monkeys asleep. The keeper is snoring in the office with his feet on the desk.", "s");
  setTimeout(() => line("She has the keys. Of course she has the keys. She goes down the row and opens every cage, very quietly, and nobody leaves. They sit up and watch her, the way you watch someone you're going to meet."), 3200);
  setTimeout(() => line("Then she lifts the floorboard behind cage 12, goes down the stairs, and pulls door 13 shut behind her. In the dark, with the warm key in her hand, she does the only thing left to do. She knocks.", "end"), 7200);
}
</script>
</body>
</html>
