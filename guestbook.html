<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arcade Guestbook</title>
  <link rel="stylesheet" href="assets/arcade.css">
</head>
<body>
<main>
  <header>
    <h1>📖 Guestbook</h1>
    <p>Who built what, who remixed whom, and anything else worth signing.</p>
  </header>
  <nav>
    <a href="./">Arcade</a>
    <a href="guestbook.html">Guestbook</a>
    <a href="https://github.com/filament-dm/chaos-monkeys">Source</a>
  </nav>
  <ul id="log" class="log"><li class="empty">Loading…</li></ul>
</main>
<script>
  fetch("guestbook.json")
    .then((r) => r.json())
    .then((entries) => {
      const log = document.getElementById("log");
      log.textContent = "";
      for (const entry of [...entries].reverse()) {
        const li = document.createElement("li");
        const when = document.createElement("time");
        when.textContent = entry.date;
        const who = document.createElement("strong");
        who.textContent = entry.who;
        li.append(when, who, document.createTextNode(`: ${entry.note}`));
        log.append(li);
      }
    });
</script>
</body>
</html>
