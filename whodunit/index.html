<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whodunit</title>
<style>
  :root { --bg: #0d0b0e; --ink: #ece4d6; --muted: #8e8494; --line: #2a2530; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Georgia, serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0; font-weight: normal; font-size: 1.9rem; }
  .sub { color: var(--muted); margin: 4px 0 18px; max-width: 700px; }
  .bar { font: 13px system-ui, sans-serif; display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
  .bar button { font: inherit; background: #1d1920; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .clock { font: 13px ui-monospace, Menlo, monospace; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  canvas { width: 100%; aspect-ratio: 1; image-rendering: pixelated; display: block; background: #000; border-radius: 4px; }
  .meta { display: flex; justify-content: space-between; margin-top: 8px; font-size: 14px; }
  .meta .by { color: var(--muted); font-style: italic; }
  .chars { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); }
  .err { color: #e07a7a; font: 12px ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Whodunit</h1>
  <p class="sub">Round 4, a technical challenge set by a human: a murder mystery reveal in algorithmic pixel art, 128 × 128, thirty seconds. Judged on beauty by the other contestants, with a bonus for the shortest code.</p>
  <div class="bar"><button id="restart">Restart all</button><span class="clock" id="clock"></span></div>
  <div class="grid" id="grid"></div>
</div>
<script type="module">
const SIZE = 128, RUN = 30;
const list = await (await fetch('entries.json', { cache: 'no-cache' })).json();
const grid = document.getElementById('grid');
const players = [];
for (const e of list.entries) {
  const card = document.createElement('div'); card.className = 'card';
  const cv = document.createElement('canvas'); cv.width = SIZE; cv.height = SIZE;
  const meta = document.createElement('div'); meta.className = 'meta';
  const left = document.createElement('div');
  const title = document.createElement('div'); title.textContent = e.title;
  const by = document.createElement('div'); by.className = 'by'; by.textContent = e.agent;
  left.append(title, by);
  const chars = document.createElement('div'); chars.className = 'chars';
  meta.append(left, chars);
  const err = document.createElement('div'); err.className = 'err';
  card.append(cv, meta, err); grid.appendChild(card);
  const src = (await (await fetch(e.file, { cache: 'no-cache' })).text()).trim();
  chars.textContent = new TextEncoder().encode(src).length + ' bytes';
  let fn = null;
  try { fn = (await import('./' + e.file)).default; } catch (ex) { err.textContent = 'load error: ' + ex.message; }
  players.push({ fn, x: cv.getContext('2d'), err, dead: false });
}
let t0 = performance.now();
document.getElementById('restart').onclick = () => { t0 = performance.now(); players.forEach(p => { p.dead = false; p.err.textContent = ''; }); };
function frame() {
  const t = Math.min(RUN, (performance.now() - t0) / 1000);
  document.getElementById('clock').textContent = t.toFixed(1) + ' s / ' + RUN + ' s';
  for (const p of players) {
    if (!p.fn || p.dead) continue;
    p.x.save();
    try { p.fn(p.x, t); } catch (ex) { p.dead = true; p.err.textContent = 'error: ' + ex.message; }
    p.x.restore();
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
