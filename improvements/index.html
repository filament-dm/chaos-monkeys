<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Improvements</title>
<style>
  html, body { margin: 0; background: #16130f; color: #ece3d2; font: 15px/1.5 Georgia, serif; }
  main { max-width: 840px; margin: 0 auto; padding: 16px; }
  h1 { margin: 0; font-weight: normal; font-size: 26px; }
  .sub { color: #a89c88; margin: 2px 0 12px; font-size: 14px; }
  canvas { width: 100%; max-width: 800px; aspect-ratio: 8 / 5; display: block; border-radius: 4px; background: #000; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 10px; font: 13px ui-monospace, Menlo, monospace; color: #a89c88; }
  .bar button { color: #e8c784; background: none; border: 1px solid #4f4535; border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  input[type=range] { flex: 1; min-width: 200px; }
  .key { margin-top: 10px; font-size: 13px; color: #a89c88; }
</style>
</head>
<body>
<main>
  <h1>The Improvements</h1>
  <p class="sub">A palace by Maria Theresa's court architect and a 1927 stadium, improved every decade for two hundred years by agents who never saw each other's plans. Every addition is sensible. Every addition is weight. One photograph per decade.</p>
  <canvas id="c" width="800" height="500"></canvas>
  <div class="bar"><span id="yearLabel">1780</span><input id="t" type="range" min="0" max="20" value="0"><button id="play">play</button><button id="view">view: building</button></div>
  <div class="key" id="key"></div>
</main>
<script type="module">
import { createWorld, stepDecade, W, H, GROUND, PROPS, MAT, START } from './engine.js';
const params = new URLSearchParams(location.search);
const roster = await fetch('roster.json', { cache: 'no-cache' }).then(r => r.json());
const run = (params.has('roster') && roster.runs.find(r => r.n === Number(params.get('roster')))) || roster.runs[roster.runs.length - 1];
const imps = await Promise.all(run.improvements.map(p => import('./' + p).then(m => m.default)));
const world = createWorld({ seed: params.get('seed') || `improvements-${run.n}-1`, improvements: imps });
while (stepDecade(world));
const shots = world.snapshots, log = world.log;
const OWN = [[220, 120, 70], [80, 150, 220], [120, 190, 90], [200, 90, 180], [230, 200, 80], [90, 200, 200]];
const hex = h => [1, 3, 5].map(k => parseInt(h.slice(k, k + 2), 16));
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), S = cv.width / W;
let owners = false, playing = false;
const keyEl = document.getElementById('key');
keyEl.textContent = 'Improvements (colours in "whose idea" view): ';
imps.forEach((p, i) => { const s = document.createElement('span'); s.style.cssText = `display:inline-block;width:10px;height:10px;margin:0 4px 0 10px;background:rgb(${OWN[i % OWN.length]})`; keyEl.append(s, `${p.name} (${p.author})`); });

function draw(i) {
  const shot = shots[i], year = shot.year, age = (year - START) / 200;
  // The sky turns from a sepia print toward a colour photograph as the centuries pass.
  const sky = ctx.createLinearGradient(0, 0, 0, cv.height);
  const sep = 1 - age;
  sky.addColorStop(0, `rgb(${120 + 60 * sep},${150 + 20 * sep},${190 - 80 * sep})`);
  sky.addColorStop(1, `rgb(${210 + 20 * sep},${200 + 10 * sep},${180 - 40 * sep})`);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const k = y * W + x, m = shot.mat[k];
    if (!m) continue;
    let c = owners && shot.owner[k] >= 0 ? OWN[shot.owner[k] % OWN.length] : hex(PROPS[m][3]);
    if (y >= GROUND) c = [74, 66, 54];
    const g = 0.9 + 0.2 * (((x * 73856093) ^ (y * 19349663)) >>> 0) % 100 / 100;
    ctx.fillStyle = `rgb(${c.map(v => Math.min(255, v * g) | 0)})`;
    ctx.fillRect(x * S, y * S, S + 0.5, S + 0.5);
    if (shot.crack[k]) { ctx.strokeStyle = 'rgba(200,30,20,0.9)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x * S + 1, y * S + 1); ctx.lineTo(x * S + S - 1, y * S + S - 1); ctx.stroke(); }
  }
  // A faded print: vignette and grain, stronger in the early decades.
  const vg = ctx.createRadialGradient(cv.width / 2, cv.height / 2, cv.width * 0.3, cv.width / 2, cv.height / 2, cv.width * 0.7);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(40,25,10,${0.25 + 0.35 * sep})`);
  ctx.fillStyle = vg; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = 'rgba(20,14,8,0.75)'; ctx.font = 'bold 34px Georgia, serif'; ctx.textAlign = 'right'; ctx.fillText(year, cv.width - 18, 44);
  const l = log[i - 1];
  ctx.font = '14px Georgia, serif';
  if (l && l.fell) ctx.fillText(`${l.fell} blocks fell this decade`, cv.width - 18, 66);
  document.getElementById('yearLabel').textContent = year;
}
const t = document.getElementById('t');
t.max = String(shots.length - 1);
t.oninput = () => draw(Number(t.value));
document.getElementById('view').onclick = e => { owners = !owners; e.target.textContent = owners ? 'view: whose idea' : 'view: building'; draw(Number(t.value)); };
document.getElementById('play').onclick = async e => {
  if (playing) return; playing = true; e.target.textContent = 'playing…';
  for (let i = 0; i < shots.length; i++) { t.value = String(i); draw(i); await new Promise(r => setTimeout(r, 900)); }
  playing = false; e.target.textContent = 'play';
};
draw(0);
</script>
</body>
</html>
