<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dignity</title>
<style>
  html, body { margin: 0; background: #14110f; color: #efe6d6; font: 15px/1.5 Georgia, serif; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  h1 { margin: 0; font-weight: normal; font-size: 26px; }
  .sub { color: #a89c88; margin: 2px 0 12px; font-size: 14px; }
  canvas { width: 100%; max-width: 960px; aspect-ratio: 960 / 600; display: block; border-radius: 6px; background: #2a2622; }
  .bar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 10px; font: 13px ui-monospace, Menlo, monospace; color: #a89c88; }
  .bar a, .bar button { color: #efc27a; background: none; border: 1px solid #5a4d3c; border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; text-decoration: none; }
  .who { margin-top: 10px; font-size: 13px; color: #a89c88; }
  .who b { font-weight: normal; }
</style>
</head>
<body>
<main>
  <h1>Dignity</h1>
  <p class="sub">A portrait of a street sweeper in Clarksville, Arkansas, made of letters that fall. Rewriters, written blind by different agents, push the letters around all night. If enough settle on the quay, they become a boat.</p>
  <canvas id="c" width="960" height="600"></canvas>
  <div class="bar">
    <span id="status">loading…</span>
    <button id="speed">speed ×1</button>
    <button id="restart">start the night over</button>
    <a id="perma" href="#">link to this night</a>
  </div>
  <div class="who" id="who"></div>
</main>
<script type="module">
import { createWorld, step, W, H, GROUND, RIVER_TOP, HARBOR, BOAT_MASS, NIGHT_TICKS } from './engine.js';

const params = new URLSearchParams(location.search);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const roster = await fetch('roster.json', { cache: 'no-cache' }).then(r => r.json());
const entry = params.has('roster') ? roster.nights.find(n => n.n === Number(params.get('roster'))) : roster.nights[roster.nights.length - 1];
const rewriters = await Promise.all(entry.rewriters.map(p => import('./' + p).then(m => m.default)));

// The page rewrites itself between visits: each night that ends (boat or dawn) moves this browser on to the next one.
let night = Number(params.get('night') || store.get('dignity:night') || 1);
const seedFor = n => params.get('seed') || `dignity-${entry.n}-night-${n}`;
let world, speed = 1;
const ctx = document.getElementById('c').getContext('2d');
const status = document.getElementById('status');

function begin() {
  world = createWorld({ seed: seedFor(night), night, rewriters });
  document.getElementById('perma').href = `?roster=${entry.n}&night=${night}`;
  document.getElementById('who').textContent = 'Rewriters tonight: ' + rewriters.map(r => `${r.name} (${r.author})`).join(' · ');
}

function draw() {
  // The sky runs through the night: dusk, deep night, then the first grey of dawn.
  const p = Math.min(1, world.tick / NIGHT_TICKS), dark = Math.sin(Math.PI * Math.min(1, p * 1.3));
  const mix = (a, b, t) => `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`;
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, mix([43, 53, 80], [8, 10, 24], dark));
  sky.addColorStop(0.6, mix([125, 106, 90], [30, 28, 44], dark));
  sky.addColorStop(1, mix([58, 48, 39], [20, 16, 14], dark));
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // Stars come out as it gets dark, and a moon crosses.
  ctx.fillStyle = `rgba(255,248,230,${0.8 * dark})`;
  for (let k = 0; k < 90; k++) { const sx = (k * 383) % W, sy = (k * 157) % (RIVER_TOP - 150); ctx.fillRect(sx, sy, k % 7 ? 1 : 2, k % 7 ? 1 : 2); }
  ctx.fillStyle = `rgba(245,238,215,${0.35 + 0.5 * dark})`;
  ctx.beginPath(); ctx.arc(80 + p * (W - 160), 90 - 50 * Math.sin(Math.PI * p), 16, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#3d4436';
  ctx.beginPath(); ctx.moveTo(0, RIVER_TOP - 40);
  for (let x = 0; x <= W; x += 40) ctx.lineTo(x, RIVER_TOP - 60 - 40 * Math.sin(x / 130) - 20 * Math.sin(x / 47));
  ctx.lineTo(W, RIVER_TOP); ctx.lineTo(0, RIVER_TOP); ctx.fill();
  ctx.fillStyle = 'rgba(70,110,140,0.55)'; ctx.fillRect(0, RIVER_TOP, HARBOR.x, GROUND - RIVER_TOP);
  ctx.fillStyle = '#4a3f33'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = 'rgba(239,194,122,0.08)'; ctx.fillRect(HARBOR.x, 0, HARBOR.w, GROUND);
  ctx.fillStyle = '#7a6a55'; ctx.fillRect(HARBOR.x, GROUND - 2, HARBOR.w, 4);
  // The portrait nobody was rolled to paint: the sweeper, after Lawrence. A tall figure in a red coat on the quay,
  // leaning on his broom, looking back at the river and the town. Faint, behind everything.
  ctx.save(); ctx.globalAlpha = 0.5; ctx.translate(HARBOR.x + 55, GROUND); ctx.scale(1.25, 1.25);
  ctx.fillStyle = '#9b2f25';
  ctx.beginPath(); ctx.moveTo(-26, -150); ctx.quadraticCurveTo(-40, -70, -34, 0); ctx.lineTo(18, 0); ctx.quadraticCurveTo(26, -80, 16, -150); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e7c9a8'; ctx.beginPath(); ctx.ellipse(-6, -170, 13, 17, -0.15, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#2a1d14'; ctx.beginPath(); ctx.ellipse(-4, -183, 15, 8, -0.2, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#e8e2d4'; ctx.beginPath(); ctx.moveTo(-14, -150); ctx.lineTo(4, -150); ctx.lineTo(-4, -128); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#6b5236'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(26, -120); ctx.lineTo(44, 0); ctx.stroke();
  ctx.fillStyle = '#8a7350'; ctx.beginPath(); ctx.moveTo(34, 0); ctx.lineTo(56, 0); ctx.lineTo(50, -14); ctx.lineTo(40, -14); ctx.closePath(); ctx.fill();
  ctx.restore();
  // A lamp on the quay.
  ctx.fillStyle = '#2d2620'; ctx.fillRect(W - 40, GROUND - 120, 3, 120);
  const glow = ctx.createRadialGradient(W - 38, GROUND - 122, 0, W - 38, GROUND - 122, 120);
  glow.addColorStop(0, `rgba(255,214,140,${0.25 + 0.35 * dark})`); glow.addColorStop(1, 'rgba(255,214,140,0)');
  ctx.fillStyle = glow; ctx.fillRect(W - 160, GROUND - 240, 160, 240);

  // The letters. Color by where they came from.
  const tint = { town: '#e8dcc4', painting: '#e0796a', song: '#efc27a', engine: '#e8dcc4' };
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const g of world.glyphs) {
    ctx.font = g.big ? 'bold 26px Georgia, serif' : '12px Georgia, serif';
    ctx.fillStyle = tint[g.tag] || '#cfe3d8';
    ctx.fillText(g.ch, g.x, g.y);
  }
  // Rewriters' own overlays.
  rewriters.forEach(r => { if (r.draw) { try { ctx.save(); r.draw(ctx, { W, H, GROUND, RIVER_TOP, HARBOR, tick: world.tick, night }); } catch (e) {} finally { ctx.restore(); } } });

  // Wages meter.
  const frac = Math.min(1, world.harborMass / BOAT_MASS);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(HARBOR.x + 10, 10, HARBOR.w - 20, 8);
  ctx.fillStyle = '#efc27a'; ctx.fillRect(HARBOR.x + 10, 10, (HARBOR.w - 20) * frac, 8);
}

function frame() {
  for (let k = 0; k < speed && !world.ended; k++) step(world);
  draw();
  const s = world.ended ? (world.ended.sailed ? 'she sailed. next night in a moment…' : 'dawn. no boat tonight. next night in a moment…') : `night ${night} · tick ${world.tick} · wages ${Math.round(world.harborMass)}/${BOAT_MASS}`;
  status.textContent = s;
  if (world.ended && !world._advancing) {
    world._advancing = true;
    setTimeout(() => { night++; store.set('dignity:night', String(night)); begin(); }, 4000);
  }
  requestAnimationFrame(frame);
}

document.getElementById('speed').onclick = e => { speed = speed >= 16 ? 1 : speed * 4; e.target.textContent = 'speed ×' + speed; };
document.getElementById('restart').onclick = () => begin();
begin();
requestAnimationFrame(frame);
</script>
</body>
</html>
